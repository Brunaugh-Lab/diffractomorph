name: Bug report
description: Report a reproducible software problem without private research data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach raw or confidential research data. Use a synthetic example."
  - type: input
    id: version
    attributes:
      label: DiffractoMorph version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and installation method.
    validations:
      required: true
